      - name: Disk image (.dmg) with the installer and the Privacy & Security helper
        run: |
          # macOS blocks the unsigned installer before it runs, so it can't help itself: next to it lies a
          # web location that opens System Settings > Privacy & Security, where "Open Anyway" lifts the block
          V=${{ env.VERSION }}
          mkdir -p dmg/.background
          cp AAFUGO-$V-mac.pkg "dmg/Install AAFUGO.pkg"
          cp AAFUGO-$V-mac-uninstall.pkg "dmg/Uninstall AAFUGO.pkg"
          cat > "dmg/Blocked? Open Privacy & Security.webloc" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>URL</key><string>x-apple.systempreferences:com.apple.preference.security?General</string></dict></plist>
          PLIST
          sed -i '' 's/^          //' "dmg/Blocked? Open Privacy & Security.webloc"
          tiffutil -cathidpicheck installer/mac_dmg/background.png installer/mac_dmg/background@2x.png -out dmg/.background/background.tiff
          hdiutil create -volname "AAFUGO $V" -srcfolder dmg -ov -format UDRW -fs HFS+ rw.dmg
          DEV=$(hdiutil attach -readwrite -noverify -noautoopen rw.dmg | grep -E '^/dev/' | head -1 | awk '{print $1}')
          sleep 2
          # the window: the steps on the background, the three files in their places (best effort on the build machine)
          osascript <<OSA || echo "Finder layout skipped"
          tell application "Finder"
            tell disk "AAFUGO $V"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {200, 120, 840, 562}
              set opts to the icon view options of container window
              set arrangement of opts to not arranged
              set icon size of opts to 64
              set text size of opts to 12
              set background picture of opts to file ".background:background.tiff"
              set position of item "Install AAFUGO.pkg" of container window to {150, 160}
              set position of item "Blocked? Open Privacy & Security.webloc" of container window to {330, 160}
              set position of item "Uninstall AAFUGO.pkg" of container window to {530, 160}
              update without registering applications
              delay 2
              close
            end tell
          end tell
          OSA
          sync
          hdiutil detach "$DEV" || hdiutil detach -force "$DEV"
          hdiutil convert rw.dmg -format UDZO -imagekey zlib-level=9 -o AAFUGO-$V-mac.dmg
